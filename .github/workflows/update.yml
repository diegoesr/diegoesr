name: Actualizar tarjeta del perfil

on:
  schedule:
    - cron: "0 12 * * *"   # todos los días a las 12:00 UTC (6:00 en CDMX)
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths: [today.py, ascii.txt]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python today.py
        env:
          # Si creas un secreto ACCESS_TOKEN (PAT) se usa ese; si no, el token automático del workflow.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || git commit -m "Actualizar estadísticas"
          git push
